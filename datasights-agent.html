<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataSights Query Agent — YoChi</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3344;
  --text: #e4e6ed;
  --text2: #8b8fa3;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --green: #00cec9;
  --orange: #fdcb6e;
  --red: #ff7675;
  --blue: #74b9ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
.sidebar { width:320px; min-width:320px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:14px; color:var(--accent2); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px; }
.sidebar-header .client { font-size:11px; color:var(--text2); }
.search-box { width:100%; padding:8px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; outline:none; margin-top:8px; }
.search-box:focus { border-color:var(--accent); }
.source-filter { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; border-bottom:1px solid var(--border); }
.source-btn { padding:3px 8px; font-size:10px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text2); cursor:pointer; transition:all .15s; }
.source-btn:hover, .source-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.table-list { flex:1; overflow-y:auto; padding:8px; }
.table-item { padding:8px 12px; border-radius:6px; cursor:pointer; margin-bottom:2px; transition:background .15s; }
.table-item:hover { background:var(--surface2); }
.table-item.active { background:var(--accent); }
.table-item.active .table-source { color:rgba(255,255,255,.7); }
.table-name { font-size:13px; font-weight:600; }
.table-source { font-size:10px; color:var(--text2); margin-top:2px; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { display:flex; align-items:center; padding:12px 20px; border-bottom:1px solid var(--border); gap:12px; background:var(--surface); }
.topbar .view-name { font-size:16px; font-weight:700; flex:1; }
.topbar .view-type { font-size:11px; padding:3px 8px; border-radius:4px; background:var(--surface2); color:var(--green); }
.content-area { flex:1; display:flex; overflow:hidden; }
.schema-panel { flex:1; overflow-y:auto; padding:20px; }
.description-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; line-height:1.6; font-size:13px; color:var(--text2); }
.columns-table { width:100%; border-collapse:collapse; font-size:12px; }
.columns-table th { text-align:left; padding:8px 12px; background:var(--surface); color:var(--accent2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--border); position:sticky; top:0; }
.columns-table td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
.columns-table tr:hover td { background:var(--surface2); }
.col-name { font-weight:600; color:var(--text); font-family:'Cascadia Code','Fira Code',monospace; }
.col-type { color:var(--orange); font-family:'Cascadia Code','Fira Code',monospace; font-size:11px; }
.col-desc { color:var(--text2); font-size:11px; line-height:1.4; }
.query-panel { width:100%; border-top:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; }
.query-panel.collapsed { height:48px; }
.query-panel.collapsed .query-body { display:none; }
.query-header { display:flex; align-items:center; padding:12px 20px; gap:12px; cursor:pointer; user-select:none; }
.query-header h3 { font-size:13px; flex:1; }
.query-body { display:flex; flex-direction:column; flex:1; min-height:0; }
.query-editor { flex:1; min-height:120px; max-height:200px; padding:12px 20px; background:var(--bg); font-family:'Cascadia Code','Fira Code',monospace; font-size:13px; color:var(--text); border:none; resize:vertical; outline:none; }
.query-actions { display:flex; align-items:center; gap:8px; padding:8px 20px; }
.btn { padding:6px 16px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent2); }
.btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); }
.query-status { flex:1; font-size:11px; color:var(--text2); text-align:right; }
.results-panel { overflow:auto; max-height:300px; border-top:1px solid var(--border); }
.results-table { width:100%; border-collapse:collapse; font-size:11px; font-family:'Cascadia Code','Fira Code',monospace; }
.results-table th { padding:6px 10px; background:var(--surface2); color:var(--accent2); text-align:left; position:sticky; top:0; font-size:10px; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap; }
.results-table td { padding:5px 10px; border-bottom:1px solid var(--border); white-space:nowrap; max-width:300px; overflow:hidden; text-overflow:ellipsis; }
.results-table tr:hover td { background:var(--surface2); }
.results-count { padding:6px 20px; font-size:11px; color:var(--text2); background:var(--surface); border-top:1px solid var(--border); }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); gap:12px; }
.empty-state h3 { color:var(--text); font-size:18px; }
.empty-state p { font-size:13px; max-width:400px; text-align:center; line-height:1.6; }
.sample-queries { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
.sample-query { padding:8px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; font-family:'Cascadia Code','Fira Code',monospace; transition:border-color .15s; text-align:left; color:var(--text); }
.sample-query:hover { border-color:var(--accent); }
.copy-toast { position:fixed; bottom:20px; right:20px; background:var(--green); color:#000; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; }
.copy-toast.show { opacity:1; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text2); }
.col-click { cursor:pointer; }
.col-click:hover { color:var(--accent2); text-decoration:underline; }
.badge { display:inline-block; padding:2px 6px; border-radius:3px; font-size:10px; font-weight:600; }
.badge-xero { background:#1a3a2a; color:#00b894; }
.badge-redcat { background:#3a2a1a; color:#fdcb6e; }
.badge-tanda { background:#1a2a3a; color:#74b9ff; }
.badge-stripe { background:#2a1a3a; color:#a29bfe; }
.badge-review { background:#3a1a2a; color:#fd79a8; }
.badge-opcentral { background:#2a3a1a; color:#55efc4; }
.badge-maintainx { background:#3a3a1a; color:#ffeaa7; }
.badge-other { background:#2a2a2a; color:#dfe6e9; }
.resize-handle { height:4px; cursor:ns-resize; background:var(--border); opacity:0; transition:opacity .2s; }
.resize-handle:hover { opacity:1; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>DataSights Agent</h2>
    <div class="client">Client: YoChi</div>
    <input type="text" class="search-box" id="searchBox" placeholder="Search tables & columns...">
  </div>
  <div class="source-filter" id="sourceFilter"></div>
  <div class="table-list" id="tableList"></div>
</div>

<div class="main">
  <div class="topbar" id="topbar" style="display:none;">
    <div class="view-name" id="viewName"></div>
    <div class="view-type" id="viewType"></div>
  </div>
  <div class="content-area" id="contentArea">
    <div class="schema-panel" id="schemaPanel">
      <div class="empty-state" id="emptyState">
        <h3>YoChi Data Explorer</h3>
        <p>Select a table from the sidebar to view its schema, or write a SQL query below. Click any column name to insert it into your query.</p>
        <div class="sample-queries">
          <button class="sample-query" onclick="setQuery('SELECT TOP 100 * FROM Venue_Master')">SELECT TOP 100 * FROM Venue_Master</button>
          <button class="sample-query" onclick="setQuery('SELECT TOP 50 StoreName, TxnDate, NetSales, GrossSales, SaleCount\nFROM PolygonRedcatAggregateSalesReport\nORDER BY TxnDate DESC')">Aggregate Sales — last 50 rows</button>
          <button class="sample-query" onclick="setQuery('SELECT * FROM XeroConsolidationGroupAndEntitiesContext')">Group & Entity Context</button>
          <button class="sample-query" onclick="setQuery('SELECT TOP 100 workplace_name, audit_name, percentage, result, submitted_at\nFROM OpCentralAuditResults\nORDER BY submitted_at DESC')">Recent Audit Results</button>
        </div>
      </div>
    </div>
  </div>
  <div class="resize-handle" id="resizeHandle"></div>
  <div class="query-panel" id="queryPanel">
    <div class="query-header" onclick="toggleQuery()">
      <h3>SQL Query</h3>
      <span id="toggleIcon">▼</span>
    </div>
    <div class="query-body">
      <textarea class="query-editor" id="queryEditor" placeholder="SELECT TOP 100 * FROM Venue_Master" spellcheck="false"></textarea>
      <div class="query-actions">
        <button class="btn btn-primary" onclick="copyQuery()">Copy Query</button>
        <button class="btn btn-secondary" onclick="clearQuery()">Clear</button>
        <button class="btn btn-secondary" onclick="formatQuery()">Format</button>
        <span class="query-status" id="queryStatus">Paste query into Claude to execute via DataSights MCP</span>
      </div>
      <div class="results-panel" id="resultsPanel"></div>
    </div>
  </div>
</div>

<div class="copy-toast" id="copyToast">Copied to clipboard!</div>

const SOURCES = [...new Set(TABLES.map(t=>t.source))].sort();
let activeSource = null;
let activeTable = null;

function getSourceBadgeClass(s) {
  const map = {Xero:'badge-xero',Redcat:'badge-redcat',Tanda:'badge-tanda',Stripe:'badge-stripe',ReviewTrackers:'badge-review',OpCentral:'badge-opcentral',MaintainX:'badge-maintainx'};
  return map[s]||'badge-other';
}

function renderSourceFilter() {
  const el = document.getElementById('sourceFilter');
  el.innerHTML = `<button class="source-btn ${!activeSource?'active':''}" onclick="filterSource(null)">All (${TABLES.length})</button>` +
    SOURCES.map(s => {
      const count = TABLES.filter(t=>t.source===s).length;
      return `<button class="source-btn ${activeSource===s?'active':''}" onclick="filterSource('${s}')">${s} (${count})</button>`;
    }).join('');
}

function filterSource(s) {
  activeSource = s;
  renderSourceFilter();
  renderTableList();
}

function renderTableList(filter='') {
  const el = document.getElementById('tableList');
  const search = filter || document.getElementById('searchBox').value.toLowerCase();
  let tables = TABLES;
  if (activeSource) tables = tables.filter(t=>t.source===activeSource);
  if (search) {
    tables = tables.filter(t =>
      t.name.toLowerCase().includes(search) ||
      t.display.toLowerCase().includes(search) ||
      t.desc.toLowerCase().includes(search) ||
      t.source.toLowerCase().includes(search) ||
      t.columns.some(c => c.name.toLowerCase().includes(search) || c.desc.toLowerCase().includes(search))
    );
  }
  el.innerHTML = tables.map(t => `
    <div class="table-item ${activeTable===t.name?'active':''}" onclick="selectTable('${t.name}')">
      <div class="table-name">${t.display}</div>
      <div class="table-source"><span class="badge ${getSourceBadgeClass(t.source)}">${t.source}</span> ${t.name}</div>
    </div>
  `).join('');
}

function selectTable(name) {
  activeTable = name;
  const t = TABLES.find(x=>x.name===name);
  document.getElementById('topbar').style.display='flex';
  document.getElementById('viewName').textContent = t.display;
  document.getElementById('viewType').textContent = t.type.toUpperCase();
  document.getElementById('emptyState').style.display='none';

  const panel = document.getElementById('schemaPanel');
  let html = `<div class="description-box">${t.desc}</div>`;

  if (t.columns.length > 0) {
    html += `<table class="columns-table">
      <thead><tr><th>Column</th><th>Type</th><th>Description</th></tr></thead>
      <tbody>${t.columns.map(c => `
        <tr>
          <td class="col-name col-click" onclick="insertColumn('${c.name}')" title="Click to insert into query">${c.name}</td>
          <td class="col-type">${c.type}</td>
          <td class="col-desc">${c.desc}</td>
        </tr>`).join('')}
      </tbody></table>`;
  } else {
    html += `<div style="padding:20px;color:var(--text2);font-size:13px;">
      Column schema not loaded — run <code style="background:var(--surface2);padding:2px 6px;border-radius:3px;">describe_view('${t.name}')</code> in Claude to fetch full schema.
      <br><br>Quick query: <button class="sample-query" onclick="setQuery('SELECT TOP 10 * FROM ${t.name}')" style="margin-top:8px;">SELECT TOP 10 * FROM ${t.name}</button>
    </div>`;
  }
  panel.innerHTML = html;
  renderTableList();
}

function insertColumn(col) {
  const editor = document.getElementById('queryEditor');
  const pos = editor.selectionStart;
  const text = editor.value;
  const insert = col.startsWith('[') ? col : col;
  editor.value = text.slice(0,pos) + insert + text.slice(pos);
  editor.focus();
  editor.selectionStart = editor.selectionEnd = pos + insert.length;
  showToast('Inserted: ' + col);
}

function setQuery(sql) {
  document.getElementById('queryEditor').value = sql;
  document.getElementById('queryEditor').focus();
}

function copyQuery() {
  const sql = document.getElementById('queryEditor').value.trim();
  if (!sql) return;
  navigator.clipboard.writeText(sql);
  showToast('Query copied to clipboard!');
}

function clearQuery() {
  document.getElementById('queryEditor').value = '';
  document.getElementById('resultsPanel').innerHTML = '';
  document.getElementById('queryEditor').focus();
}

function formatQuery() {
  const editor = document.getElementById('queryEditor');
  let sql = editor.value.trim();
  const keywords = ['SELECT','FROM','WHERE','AND','OR','GROUP BY','ORDER BY','HAVING','JOIN','INNER JOIN','LEFT JOIN','RIGHT JOIN','ON','UNION','INSERT','UPDATE','DELETE','SET','VALUES','INTO','TOP','DISTINCT','AS','IN','NOT','NULL','IS','BETWEEN','LIKE','EXISTS','CASE','WHEN','THEN','ELSE','END','SUM','COUNT','AVG','MIN','MAX','COALESCE','CAST','CONVERT','DATEADD','DATEDIFF','EOMONTH','GETDATE','DATEFROMPARTS'];
  keywords.forEach(kw => {
    const regex = new RegExp('\\b' + kw.replace(/ /g,'\\s+') + '\\b','gi');
    sql = sql.replace(regex, kw);
  });
  sql = sql.replace(/\s*(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|INNER JOIN|LEFT JOIN|RIGHT JOIN|JOIN|UNION)\s*/gi, (m,kw) => '\n' + kw.toUpperCase() + ' ');
  sql = sql.replace(/\s*(AND|OR)\s*/gi, (m,kw) => '\n  ' + kw.toUpperCase() + ' ');
  editor.value = sql.trim();
}

function toggleQuery() {
  document.getElementById('queryPanel').classList.toggle('collapsed');
  const icon = document.getElementById('toggleIcon');
  icon.textContent = icon.textContent === '▼' ? '▲' : '▼';
}

function showToast(msg) {
  const el = document.getElementById('copyToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

document.getElementById('searchBox').addEventListener('input', () => renderTableList());

document.getElementById('queryEditor').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart;
    e.target.value = e.target.value.slice(0,start) + '  ' + e.target.value.slice(start);
    e.target.selectionStart = e.target.selectionEnd = start + 2;
  }
});

renderSourceFilter();
renderTableList();
</script>
</body>
</html>
